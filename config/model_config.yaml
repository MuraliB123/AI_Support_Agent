chat:
  provider: deepseek
  # Prefer a tool/structured-output capable chat id (not reasoner-only)
  model: deepseek-chat
  temperature: 0.0
  max_tokens: 2048
  max_retries: 2
  timeout_seconds: 60

embeddings:
  provider: huggingface
  # Local BGE — dims must match Atlas vector index
  model: BAAI/bge-small-en-v1.5
  dimensions: 384
  normalize: true

rerank:
  # Phase 4: fuse vector + keyword lists; optional LLM rerank later
  strategy: reciprocal_rank_fusion
  llm_rerank: false
